name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build-${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        shell: bash
        run: |
          mkdir -p dist

          binary="praetor"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            binary="praetor.exe"
          fi

          CGO_ENABLED=0 \
          GOOS=${{ matrix.goos }} \
          GOARCH=${{ matrix.goarch }} \
          go build \
            -trimpath \
            -o "dist/${binary}" \
            ./cmd/praetor

      - name: Package
        shell: bash
        run: |
          cd dist
          name="praetor-${GITHUB_REF_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}"

          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "${name}.zip" praetor.exe
            rm praetor.exe
          else
            tar -czf "${name}.tar.gz" praetor
            rm praetor
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: praetor-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=()

          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            flags+=(--prerelease)
          fi

          gh release create "${GITHUB_REF_NAME}" \
            dist/* \
            --title "Praetor ${GITHUB_REF_NAME}" \
            --generate-notes \
            "${flags[@]}"
